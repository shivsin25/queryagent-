[project]
name = "query-tool"
version = "0.1.0"
description = "Self-correcting multi-agent RAG: writer -> reviewer -> feedback loop with grounded citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "streamlit>=1.40",
    "typer>=0.12",
    "rich>=13",
    "snowballstemmer>=3.1.1",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.2"]
openai = [
    "langchain-openai>=0.3",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
qt = "query_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Markdown tables and Graphviz labels can't be wrapped.
"frontend/views/architecture.py" = ["E501"]
